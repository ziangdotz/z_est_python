<svg xmlns="http://www.w3.org/2000/svg" viewBox="86 86 340 340" width="64" height="64">
	<defs>
		<!-- 渐变定义 -->
		<linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#00e5ff" />
			<stop offset="45%" stop-color="#448aff" />
			<stop offset="100%" stop-color="#b388ff" />
		</linearGradient>
		<linearGradient id="hGrad" x1="0.2" y1="0" x2="0.8" y2="1">
			<stop offset="0%" stop-color="#80d8ff" />
			<stop offset="50%" stop-color="#536dfe" />
			<stop offset="100%" stop-color="#b388ff" />
		</linearGradient>

		<!-- iOS 液态玻璃渐变 -->
		<radialGradient id="glassBase" cx="44%" cy="42%" r="56%">
			<stop offset="0%" stop-color="rgba(255,255,255,0.14)" />
			<stop offset="35%" stop-color="rgba(255,255,255,0.06)" />
			<stop offset="70%" stop-color="rgba(120,160,255,0.06)" />
			<stop offset="100%" stop-color="rgba(80,100,200,0.08)" />
		</radialGradient>
		<radialGradient id="glassSheen" cx="38%" cy="34%" r="62%">
			<stop offset="0%" stop-color="rgba(255,255,255,0.16)" />
			<stop offset="40%" stop-color="rgba(255,255,255,0.04)" />
			<stop offset="100%" stop-color="rgba(255,255,255,0)" />
		</radialGradient>
		<radialGradient id="glassDepth" cx="62%" cy="64%" r="55%">
			<stop offset="0%" stop-color="rgba(0,0,0,0)" />
			<stop offset="50%" stop-color="rgba(80,60,160,0.04)" />
			<stop offset="100%" stop-color="rgba(60,40,180,0.09)" />
		</radialGradient>
		<linearGradient id="glassTopSpecular" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="rgba(255,255,255,0.28)" />
			<stop offset="30%" stop-color="rgba(255,255,255,0.08)" />
			<stop offset="100%" stop-color="rgba(255,255,255,0)" />
		</linearGradient>
		<linearGradient id="glassInnerEdge" x1="0.5" y1="0" x2="0.5" y2="1">
			<stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
			<stop offset="50%" stop-color="rgba(255,255,255,0.06)" />
			<stop offset="100%" stop-color="rgba(200,180,255,0.14)" />
		</linearGradient>
		<linearGradient id="glassRimHL" x1="0.5" y1="0" x2="0.5" y2="1">
			<stop offset="0%" stop-color="rgba(255,255,255,0.35)" />
			<stop offset="45%" stop-color="rgba(255,255,255,0.10)" />
			<stop offset="100%" stop-color="rgba(200,180,255,0.18)" />
		</linearGradient>
		<radialGradient id="glassCenterDisc" cx="42%" cy="38%" r="58%">
			<stop offset="0%" stop-color="rgba(255,255,255,0.10)" />
			<stop offset="50%" stop-color="rgba(100,140,220,0.05)" />
			<stop offset="100%" stop-color="rgba(180,160,220,0.03)" />
		</radialGradient>

		<!-- 滤镜 -->
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3" result="b" />
			<feMerge>
				<feMergeNode in="b" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
		<filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="6" result="b" />
			<feMerge>
				<feMergeNode in="b" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
		<filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="4" result="b" />
			<feMerge>
				<feMergeNode in="b" />
				<feMergeNode in="b" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>

	<!-- ═══════════════════════════════════════════ -->
	<!--  外层：发光与主弧                           -->
	<!-- ═══════════════════════════════════════════ -->

	<!-- 中心径向辉光（透过玻璃可见） -->
	<circle cx="256" cy="256" r="95" fill="rgba(68,138,255,0.18)" />

	<!-- 外环轨道（极淡） -->
	<circle cx="256" cy="256" r="118" fill="none" stroke="#8ab4f8" stroke-width="14" opacity="0.06" />

	<!-- 主渐变弧（仪表盘） -->
	<circle cx="256" cy="256" r="118" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"
		stroke-dasharray="556 186" transform="rotate(60,256,256)" filter="url(#glow)" />

	<!-- 弧端发光指示器 -->
	<circle cx="358" cy="197" r="7" fill="#00e5ff" opacity="0.25" filter="url(#glowStrong)" />
	<circle cx="358" cy="197" r="4.5" fill="#00e5ff" filter="url(#glow)" />
	<circle cx="358" cy="197" r="2" fill="#ffffff" />

	<!-- ═══════════════════════════════════════════ -->
	<!--  iOS 液态玻璃主体                           -->
	<!-- ═══════════════════════════════════════════ -->

	<!-- 底层：深色微弱色偏 -->
	<circle cx="256" cy="256" r="112" fill="rgba(20,30,80,0.12)" />

	<!-- 玻璃基底（主色调） -->
	<circle cx="256" cy="256" r="112" fill="url(#glassBase)" />

	<!-- 表面光泽（左上高光） -->
	<circle cx="256" cy="256" r="112" fill="url(#glassSheen)" />

	<!-- 深度感（右下暗部） -->
	<circle cx="256" cy="256" r="112" fill="url(#glassDepth)" />

	<!-- 顶部弧形高光条（模拟光源反射） -->
	<clipPath id="glassClip">
		<circle cx="256" cy="256" r="112" />
	</clipPath>
	<rect x="144" y="145" width="224" height="52" rx="0" fill="url(#glassTopSpecular)" clip-path="url(#glassClip)"
		opacity="0.7" />

	<!-- 内边缘折射光环 -->
	<circle cx="256" cy="256" r="110" fill="none" stroke="url(#glassInnerEdge)" stroke-width="1.5" opacity="0.7" />

	<!-- 玻璃外缘高光 -->
	<circle cx="256" cy="256" r="112.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.6" />

	<!-- ═══════════════════════════════════════════ -->
	<!--  内部装饰（透过玻璃可见）                    -->
	<!-- ═══════════════════════════════════════════ -->

	<!-- 24条精密刻度 -->
	<g opacity="0.12" stroke="#8ab4f8" stroke-width="1.2" stroke-linecap="round">
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(0,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(15,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(30,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(45,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(60,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(75,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(90,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(105,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(120,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(135,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(150,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(165,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(180,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(195,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(210,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(225,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(240,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(255,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(270,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(285,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(300,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(315,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(330,256,256)" />
		<line x1="256" y1="140" x2="256" y2="154" transform="rotate(345,256,256)" />
	</g>

	<!-- 内层装饰环 -->
	<circle cx="256" cy="256" r="94" fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="0.8" />
	<circle cx="256" cy="256" r="80" fill="none" stroke="rgba(179,136,255,0.08)" stroke-width="0.4" />

	<!-- 内层装饰短弧 -->
	<circle cx="256" cy="256" r="87" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"
		stroke-dasharray="28 506" opacity="0.15" transform="rotate(30,256,256)" />
	<circle cx="256" cy="256" r="87" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-linecap="round"
		stroke-dasharray="42 492" opacity="0.12" transform="rotate(150,256,256)" />
	<circle cx="256" cy="256" r="87" fill="none" stroke="#448aff" stroke-width="1.2" stroke-linecap="round"
		stroke-dasharray="20 514" opacity="0.10" transform="rotate(260,256,256)" />

	<!-- 六边形精密框架 -->
	<polygon points="256,204 303,231 303,285 256,312 209,285 209,231" fill="none" stroke="rgba(0,229,255,0.10)"
		stroke-width="1" stroke-linejoin="round" />
	<!-- 六边形顶点标记 -->
	<g fill="#00e5ff" opacity="0.35">
		<circle cx="256" cy="204" r="2" />
		<circle cx="303" cy="231" r="1.6" />
		<circle cx="303" cy="285" r="1.6" />
		<circle cx="256" cy="312" r="2" />
		<circle cx="209" cy="285" r="1.6" />
		<circle cx="209" cy="231" r="1.6" />
	</g>

	<!-- ═══════════════════════════════════════════ -->
	<!--  中心：H 标识区                              -->
	<!-- ═══════════════════════════════════════════ -->

	<!-- 中心玻璃小圆盘（H 背景，更深一层玻璃感） -->
	<circle cx="256" cy="256" r="55" fill="rgba(255,255,255,0.04)" />
	<circle cx="256" cy="256" r="55" fill="url(#glassCenterDisc)" />
	<circle cx="256" cy="256" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" />

	<!-- 中心十字准线 -->
	<g stroke="#ffffff" stroke-width="0.4" opacity="0.08">
		<line x1="238" y1="256" x2="274" y2="256" />
		<line x1="256" y1="238" x2="256" y2="274" />
	</g>

	<!-- H 字母（核心标识） — 三段式斜体衬线风格，居中于(256,256) -->
	<g fill="url(#hGrad)" filter="url(#textGlow)" transform="translate(3,-4)">
		<path d="M 219,226 L 230,225 L 230,297 L 219,298 L 212,298 L 212,226 Z" />
		<path d="M 283,223 L 294,222 L 294,294 L 283,295 L 276,295 L 276,223 Z" />
		<rect x="219" y="259" width="68" height="6" rx="1.5" />
	</g>

	<!-- ═══════════════════════════════════════════ -->
	<!--  外层粒子（玻璃外侧）                       -->
	<!-- ═══════════════════════════════════════════ -->

	<g filter="url(#glow)">
		<circle cx="168" cy="168" r="3" fill="#00e5ff" opacity="0.65" />
		<circle cx="348" cy="328" r="2.5" fill="#b388ff" opacity="0.55" />
		<circle cx="150" cy="318" r="2.5" fill="#448aff" opacity="0.50" />
		<circle cx="328" cy="150" r="2.8" fill="#00e5ff" opacity="0.42" />
		<circle cx="135" cy="252" r="1.8" fill="#448aff" opacity="0.38" />
		<circle cx="378" cy="265" r="2" fill="#b388ff" opacity="0.35" />
		<circle cx="208" cy="350" r="1.8" fill="#00e5ff" opacity="0.30" />
		<circle cx="332" cy="358" r="1.5" fill="#448aff" opacity="0.25" />
		<circle cx="125" cy="195" r="1.3" fill="#00e5ff" opacity="0.22" />
		<circle cx="382" cy="198" r="1.2" fill="#b388ff" opacity="0.18" />
		<circle cx="188" cy="125" r="1.5" fill="#448aff" opacity="0.22" />
		<circle cx="340" cy="365" r="1" fill="#00e5ff" opacity="0.15" />
	</g>

	<!-- 粒子间关联线 -->
	<g stroke="#448aff" stroke-width="0.4" opacity="0.06">
		<line x1="168" y1="168" x2="328" y2="150" />
		<line x1="150" y1="318" x2="348" y2="328" />
		<line x1="135" y1="252" x2="168" y2="168" />
		<line x1="378" y1="265" x2="348" y2="328" />
		<line x1="328" y1="150" x2="378" y2="265" />
		<line x1="150" y1="318" x2="208" y2="350" />
	</g>

</svg>
